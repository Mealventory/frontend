appId: com.mealventory.app
name: Critical pantry journey
---
- launchApp
- assertVisible:
    id: "e2e-mode-indicator"
- assertVisible: "Welcome back"
- assertVisible:
    id: "e2e-email"
- assertVisible:
    id: "e2e-password"
- assertVisible: "Continue as E2E tester"
- tapOn: "Continue as E2E tester"

- assertVisible: "E2E Test Kitchen"
- tapOn:
    id: "e2e-enter-kitchen"
- assertVisible: "My Kitchen"

- tapOn:
    id: "e2e-add-manual"
- assertVisible: "Manual Entry"
- tapOn:
    id: "e2e-item-name"
- inputText: "E2E Apples"
- hideKeyboard
- tapOn:
    id: "e2e-item-quantity"
- inputText: "2 bags"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "e2e-add-to-kitchen"
    direction: DOWN
- tapOn:
    id: "e2e-add-to-kitchen"

- assertVisible: "E2E Apples"
- tapOn: "E2E Apples"
- assertVisible: "Item Detail"

- tapOn:
    id: "e2e-edit-item"
- assertVisible: "Edit item"
- tapOn:
    id: "e2e-edit-name"
- eraseText: 40
- inputText: "E2E Apples Edited"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "e2e-save-edit"
    direction: DOWN
- tapOn:
    id: "e2e-save-edit"

- assertVisible: "E2E Apples Edited"
- tapOn:
    id: "e2e-consume-item"
- assertVisible: "My Kitchen"
- assertNotVisible: "E2E Apples Edited"

- tapOn:
    id: "tab-settings"
- assertVisible: "Account & Session"
- tapOn:
    id: "e2e-log-out"
- assertVisible: "Welcome back"
