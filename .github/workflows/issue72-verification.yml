name: Issue 72 verification

on:
  push:
    branches:
      - feat/72-storage-zone-dashboard
  pull_request:
    branches:
      - main

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install --package-lock=false

      - name: TypeScript
        run: npm run typecheck

      - name: Tests
        run: npm test
