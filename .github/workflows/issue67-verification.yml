name: Issue 67 verification

on:
  push:
    branches:
      - feat/67-cooking-mode

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --package-lock=false
      - run: npm run typecheck
      - run: npm test
