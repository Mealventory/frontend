name: Planned meal readiness verification

on:
  push:
    branches:
      - feat/planned-meal-readiness
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Expo config
        run: npx expo config --type public > /dev/null

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
